<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060E1A" />
    <title>অফলাইন — মাহবুব সরদার সবুজ</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at top, #152844 0%, #060E1A 58%); color: #FAF6EF; font-family: AdorshoLipi, system-ui, sans-serif; }
      main { width: min(100%, 560px); padding: clamp(28px, 7vw, 52px); text-align: center; background: rgba(8, 18, 32, .78); border: 1px solid rgba(201, 168, 76, .32); border-radius: 24px; box-shadow: 0 24px 70px rgba(0, 0, 0, .42); }
      h1 { margin: 0 0 14px; color: #E8C97A; font-size: clamp(1.8rem, 7vw, 2.8rem); }
      p { margin: 0; color: rgba(250, 246, 239, .78); font-size: 1.05rem; line-height: 1.75; }
      button { margin-top: 26px; border: 1px solid rgba(201, 168, 76, .62); border-radius: 999px; padding: 12px 20px; background: #C9A84C; color: #060E1A; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>আপনি অফলাইনে আছেন</h1>
      <p>ইন্টারনেট সংযোগ ফিরে এলে পেজটি আবার লোড করুন। আগে দেখা কিছু পেজ ও ছবি ক্যাশ থেকে দ্রুত পাওয়া যেতে পারে।</p>
      <button type="button" onclick="window.location.reload()">আবার চেষ্টা করুন</button>
    </main>
  </body>
</html>
